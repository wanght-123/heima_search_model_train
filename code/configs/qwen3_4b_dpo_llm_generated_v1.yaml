### Qwen3-4B LoRA DPO：LLM 原创招聘业务偏好数据 v1
model_name_or_path: code/outputs/merged/qwen3-4b-recruitment-sft
template: qwen3
stage: dpo
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

dataset_dir: code/data/datasets/llamafactory
dataset: recruitment_dpo_llm_generated_v1_train
eval_dataset: recruitment_dpo_llm_generated_v1_eval
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: code/outputs/runs/dpo-qwen3-4b-llm-generated-v1
overwrite_output_dir: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
per_device_eval_batch_size: 1
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.3
bf16: true
gradient_checkpointing: true
pref_beta: 0.1

logging_steps: 10
eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
report_to: none
seed: 20260712
