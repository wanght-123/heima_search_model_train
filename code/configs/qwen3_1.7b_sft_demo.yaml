### Qwen3-1.7B LoRA SFT 演示配置（Mac CPU/MPS 用小样本快速跑通流程）
model_name_or_path: ../../环境和物料/models/models/Qwen--Qwen3-1.7B/snapshots/master
template: qwen3
stage: sft
do_train: true
do_eval: false
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

dataset_dir: code/data/datasets/llamafactory
dataset: recruitment_sft_train
cutoff_len: 512
packing: false

output_dir: code/outputs/runs/sft-qwen3-1.7b-demo
overwrite_output_dir: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_samples: 100
lr_scheduler_type: cosine
warmup_ratio: 0.03
gradient_checkpointing: false

logging_steps: 5
save_steps: 50
save_total_limit: 2
plot_loss: false
report_to: none
seed: 20260614
